function plist(){const t=T[CUR],q=wd(ST.q.trim()),el=document.getElementById("plist");let h="";
 if(!q.length)h='<div class="ng">'+C.map((c,i)=>'<a class="nt fi" href="#sortiment-'+c[0]+'" style="animation-delay:'+i*45+'ms">'+(CIMG[c[0]]?'<img class="ci" src="'+CIMG[c[0]]+'" alt="">':ic(CI[c[1]]))+'<em>'+String(i+1).padStart(2,"0")+'</em><h3>'+g(c[2])+'</h3><small>'+cnt(c)+'</small></a>').join("")+'</div>';
 else C.forEach(c=>{const r=[];c[3].forEach(x=>x[1].forEach(y=>{if(hit(y[0],q))r.push(y)}));if(r.length)h+='<div class="sh"><h3><a href="#sortiment-'+c[0]+'" style="color:inherit;text-decoration:none">'+g(c[2])+'</a></h3><small>'+r.length+'</small></div><div class="pgrid">'+r.map(y=>card(y,c[0],c[1])).join("")+'</div>'});
 el.innerHTML=h||'<p class="lead">'+t.sr[2]+'</p>'}
function chrome(){const t=T[CUR];document.documentElement.lang=CUR;document.documentElement.dir=CUR==="ar"?"rtl":"ltr";
 document.getElementById("nm").textContent=CFG.name;
 document.getElementById("nav").innerHTML=["#start","#sortiment","#standort"].map((h,i)=>'<a href="'+h+'">'+t.nv[i]+'</a>').join("");
 document.getElementById("ft").textContent="© 2026 "+CFG.name;
 document.getElementById("lg").textContent=t.lg;document.getElementById("dp").textContent=t.dp;
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===CUR));
 const tl="+"+CFG.wa;
 document.querySelector("#tp .w").innerHTML='<span>'+t.lb[4]+'</span><a href="tel:'+tl+'">'+CFG.tel+'</a>'+(CFG.mail?'<a href="mailto:'+CFG.mail+'">'+CFG.mail+'</a>':"");
 document.getElementById("ab").innerHTML='<a href="tel:'+tl+'">'+ic(IT)+t.ab[0]+'</a><a href="https://wa.me/'+CFG.wa+'" target="_blank" rel="noopener">'+ic(WA)+'WhatsApp</a><a href="'+LINK.goog+'" target="_blank" rel="noopener">'+ic(IP)+t.ab[2]+'</a>'}
function show(top){const t=T[CUR],h=(location.hash||"").slice(1),ci=h.indexOf("sortiment-")===0?C.findIndex(c=>c[0]===h.slice(10)):-1,v=ci>-1?"sortiment":(V[h]?h:"start");
 M.innerHTML='<div class="pg">'+(ci>-1?CV(t,ci):V[v](t))+'</div>';
 document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+v));
 document.title=({start:t.nv[0],sortiment:t.nv[1],standort:t.nv[2],impressum:t.lg,datenschutz:t.dp})[v]+" – "+CFG.name;
 if(v==="sortiment"&&ci<0)plist();if(top)scrollTo(0,0);watch();fitMap();rvInit()}
function count(e){const n=+e.dataset.n,s=e.dataset.s,t0=performance.now(),loc=CUR==="ar"?"en":CUR;
 (function f(now){const p=Math.min((now-t0)/1600,1),v=Math.round(n*(1-Math.pow(1-p,3)));e.textContent=v.toLocaleString(loc)+(p===1?s:"");if(p<1)requestAnimationFrame(f)})(t0)}
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");x.target.querySelectorAll("[data-n]").forEach(count);io.unobserve(x.target)}}),{threshold:.15});
function watch(){document.querySelectorAll(".rv").forEach(e=>io.observe(e))}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{CUR=b.dataset.l;chrome();show(false);try{localStorage.setItem("lang",CUR)}catch(e){}});
addEventListener("hashchange",()=>show(true));
addEventListener("scroll",()=>document.getElementById("hd").classList.toggle("sc",scrollY>10),{passive:true});
let sv=null;try{sv=localStorage.getItem("lang")}catch(e){}
if(!sv||!T[sv]){const n=(navigator.language||"de").slice(0,2);sv=T[n]?n:"de"}
CUR=sv;chrome();show(false);

function live(z){const el=document.getElementById("lv");if(!el)return;z=Math.max(12,Math.min(19,z||17));el.hidden=false;
 const W=el.clientWidth,H=el.clientHeight,n=Math.pow(2,z),r=CFG.lat*Math.PI/180,x=(CFG.lng+180)/360*n*256,y=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n*256,x0=x-W/2,y0=y-H/2;let h="";
 for(let a=Math.floor(x0/256);a<=Math.floor((x0+W)/256);a++)for(let b=Math.floor(y0/256);b<=Math.floor((y0+H)/256);b++)h+='<img alt="" src="https://tile.openstreetmap.org/'+z+'/'+a+'/'+b+'.png" style="left:'+Math.round(a*256-x0)+'px;top:'+Math.round(b*256-y0)+'px" onerror="liveFail()">';
 el.innerHTML=h+'<svg class="lp" viewBox="-20 -58 40 58"><path d="M0 0C-14-18-20-28-20-38a20 20 0 0 1 40 0C20-28 14-18 0 0z" fill="#1e3552"/><circle cy="-38" r="7" fill="#fff"/></svg><div class="zb"><button onclick="live('+(z+1)+')">+</button><button onclick="live('+(z-1)+')">−</button></div><span class="at">© OpenStreetMap contributors</span>';
 document.getElementById("lvb").textContent=T[CUR].lv[1]}
function fitMap(){const v=document.querySelector(".map svg");if(v)v.setAttribute("viewBox",innerWidth<=860?"160 40 340 410":"0 0 640 460")}
addEventListener("resize",fitMap);
function liveToggle(){const el=document.getElementById("lv");if(el.hidden)live(17);else{el.hidden=true;el.innerHTML="";document.getElementById("lvb").textContent=T[CUR].lv[0]}}
function liveFail(){const el=document.getElementById("lv"),b=document.getElementById("lvb");if(!el||el.hidden)return;el.hidden=true;el.innerHTML="";b.textContent=T[CUR].lv[2];setTimeout(()=>{b.textContent=T[CUR].lv[0]},4000)}

const bgb=document.getElementById("bg"),mnu=document.getElementById("mn");
function menu(o){mnu.classList.toggle("open",o);bgb.setAttribute("aria-expanded",o)}
bgb.onclick=()=>menu(!mnu.classList.contains("open"));
mnu.addEventListener("click",e=>{if(e.target.closest("nav a"))menu(false)});
addEventListener("hashchange",()=>menu(false));
addEventListener("resize",()=>{if(innerWidth>860)menu(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")menu(false)});

 const c=()=>o.remove();o.onclick=e=>{if(e.target===o)c()};o.querySelector("#tsx").onclick=c;
 o.querySelector("#tsc").onclick=function(){const b=this,n=o.querySelector("#tsn");try{const r=document.createRange();r.selectNodeContents(n);const q=getSelection();q.removeAllRanges();q.addRange(r);if(document.execCommand("copy"))b.textContent=t[2]}catch(x){}try{navigator.clipboard.writeText("+"+CFG.wa).then(()=>{b.textContent=t[2]},()=>{})}catch(x){}}}
